<!-- Configuration de l'agent Wazuh du poste endpoint-ubuntu -->
<ossec_config>
  <client>
    <server>
      <address>wazuh.manager</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <config-profile>ubuntu, ubuntu24</config-profile>
    <notify_time>10</notify_time>
    <time-reconnect>60</time-reconnect>
    <auto_restart>yes</auto_restart>
    <enrollment>
      <enabled>yes</enabled>
      <agent_name>endpoint-ubuntu</agent_name>
      <groups>default</groups>
    </enrollment>
  </client>

  <client_buffer>
    <disabled>no</disabled>
    <queue_size>5000</queue_size>
    <events_per_second>500</events_per_second>
  </client_buffer>

  <!-- Détection de rootkits / anomalies système -->
  <rootcheck>
    <disabled>no</disabled>
    <check_files>yes</check_files>
    <check_trojans>yes</check_trojans>
    <check_dev>yes</check_dev>
    <check_sys>yes</check_sys>
    <check_pids>yes</check_pids>
    <check_ports>yes</check_ports>
    <check_if>yes</check_if>
    <frequency>43200</frequency>
    <rootkit_files>etc/shared/rootkit_files.txt</rootkit_files>
    <rootkit_trojans>etc/shared/rootkit_trojans.txt</rootkit_trojans>
    <skip_nfs>yes</skip_nfs>
  </rootcheck>

  <!-- Audit de configuration (benchmark CIS Ubuntu) -->
  <sca>
    <enabled>yes</enabled>
    <scan_on_start>yes</scan_on_start>
    <interval>12h</interval>
    <skip_nfs>yes</skip_nfs>
  </sca>

  <!-- Inventaire : paquets, ports, processus, utilisateurs -->
  <wodle name="syscollector">
    <disabled>no</disabled>
    <interval>1h</interval>
    <scan_on_start>yes</scan_on_start>
    <hardware>yes</hardware>
    <os>yes</os>
    <network>yes</network>
    <packages>yes</packages>
    <ports all="no">yes</ports>
    <processes>yes</processes>
    <users>yes</users>
    <groups>yes</groups>
  </wodle>

  <!-- Surveillance d'intégrité des fichiers (FIM) -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>3600</frequency>
    <scan_on_start>yes</scan_on_start>
    <alert_new_files>yes</alert_new_files>

    <!-- Fichiers critiques surveillés en temps réel.
         On surveille les RÉPERTOIRES (filtrés par "restrict") et non les fichiers seuls :
         sed -i, useradd ou visudo remplacent le fichier (nouvel inode), ce qui fait
         perdre la surveillance temps réel d'un fichier isolé après la 1re modification. -->
    <directories realtime="yes" report_changes="yes" check_all="yes" recursion_level="0"
                 restrict="^/etc/passwd$|^/etc/shadow$|^/etc/group$|^/etc/sudoers$|^/etc/crontab$">/etc</directories>
    <directories realtime="yes" check_all="yes">/etc/sudoers.d</directories>
    <directories realtime="yes" check_all="yes">/etc/cron.d,/var/spool/cron/crontabs</directories>
    <directories realtime="yes" check_all="yes">/etc/systemd/system</directories>
    <directories realtime="yes" report_changes="yes" check_all="yes" restrict="^/etc/ssh/sshd_config$">/etc/ssh</directories>
    <directories realtime="yes" check_all="yes">/root,/home</directories>
    <directories realtime="yes" check_all="yes">/usr/bin,/usr/sbin,/usr/local/bin</directories>

    <ignore>/etc/mtab</ignore>
    <ignore type="sregex">.log$|.swp$|.bash_history$</ignore>
    <nodiff>/etc/shadow</nodiff>

    <skip_nfs>yes</skip_nfs>
    <process_priority>10</process_priority>
    <max_eps>100</max_eps>
    <synchronization>
      <enabled>yes</enabled>
      <interval>5m</interval>
    </synchronization>
  </syscheck>

  <!-- Journaux collectés -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/auth.log</location>
  </localfile>
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/syslog</location>
  </localfile>
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/dpkg.log</location>
  </localfile>

  <!-- Commandes exécutées périodiquement : ports en écoute et derniers logins -->
  <localfile>
    <log_format>full_command</log_format>
    <command>ss -lntu | grep -v 127.0.0 | sort</command>
    <alias>netstat listening ports</alias>
    <frequency>120</frequency>
  </localfile>

  <active-response>
    <disabled>yes</disabled>
  </active-response>

  <logging>
    <log_format>plain</log_format>
  </logging>
</ossec_config>
